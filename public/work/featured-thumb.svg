<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050409" />
      <stop offset="50%" stop-color="#09140e" />
      <stop offset="100%" stop-color="#050409" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1F4633" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#1F4633" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#F7F1DB" fill-opacity="0.08" />
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)" />
  <circle cx="640" cy="360" r="420" fill="url(#glow)" />
  <rect width="1280" height="720" fill="url(#grid-dots)" />

  <!-- Mock Workflow Canvas Graphic in Background -->
  <g opacity="0.4" transform="translate(140, 160)">
    <!-- Connection lines -->
    <path d="M 120 200 L 380 200 L 640 200 L 900 200" fill="none" stroke="#8DBF9F" stroke-width="2" stroke-dasharray="6 6" />
    
    <!-- Step Nodes -->
    <g transform="translate(80, 160)">
      <rect width="80" height="80" rx="20" fill="#0c1811" stroke="#1F4633" stroke-width="2" />
      <circle cx="40" cy="40" r="14" fill="#8DBF9F" opacity="0.6" />
      <text x="40" y="105" text-anchor="middle" fill="#F7F1DB" font-family="sans-serif" font-size="12" font-weight="bold">TRIGGER</text>
    </g>
    <g transform="translate(340, 160)">
      <rect width="80" height="80" rx="20" fill="#0c1811" stroke="#1F4633" stroke-width="2" />
      <circle cx="40" cy="40" r="14" fill="#8DBF9F" opacity="0.6" />
      <text x="40" y="105" text-anchor="middle" fill="#F7F1DB" font-family="sans-serif" font-size="12" font-weight="bold">ENRICH</text>
    </g>
    <g transform="translate(600, 160)">
      <rect width="80" height="80" rx="20" fill="#0c1811" stroke="#1F4633" stroke-width="2" />
      <circle cx="40" cy="40" r="14" fill="#8DBF9F" opacity="0.6" />
      <text x="40" y="105" text-anchor="middle" fill="#F7F1DB" font-family="sans-serif" font-size="12" font-weight="bold">AI AGENT</text>
    </g>
    <g transform="translate(860, 160)">
      <rect width="80" height="80" rx="20" fill="#0c1811" stroke="#1F4633" stroke-width="2" />
      <circle cx="40" cy="40" r="14" fill="#8DBF9F" opacity="0.6" />
      <text x="40" y="105" text-anchor="middle" fill="#F7F1DB" font-family="sans-serif" font-size="12" font-weight="bold">OUTBOUND</text>
    </g>
  </g>

  <!-- Centered Play Button -->
  <g transform="translate(640, 360)" filter="url(#shadow)">
    <circle r="46" fill="#F7F1DB" />
    <polygon points="-8,-16 16,0 -8,16" fill="#050409" />
  </g>

  <!-- Duration Badge -->
  <g transform="translate(1180, 660)">
    <rect x="-80" y="-30" width="70" height="24" rx="12" fill="#050409" fill-opacity="0.8" stroke="#F7F1DB" stroke-opacity="0.2" />
    <text x="-45" y="-14" text-anchor="middle" fill="#F7F1DB" font-family="monospace" font-size="11" font-weight="bold">4:15</text>
  </g>
</svg>
